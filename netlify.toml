# Netlify 배포 설정 (Aviation Wallet OS)
# 이 파일은 Netlify가 저장소를 어떻게 빌드하고 서빙할지 정의한다.

[build]
  # Vite 프로덕션 빌드 명령. 결과물은 dist/ 폴더에 생성된다.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 빌드에 사용할 Node 버전을 고정한다(로컬/CI 동작 일치).
  NODE_VERSION = "20"

# (2단계 완료) 과거 aiapp 프록시는 제거됨 — 모든 API 호출은 코드 내부(baasFetch)에서 Supabase로 처리된다.

# SPA(단일 페이지 앱) 라우팅 처리:
# 이 앱은 react-router로 /login, /logbook, /dashboard 등 클라이언트 경로를 쓴다.
# 사용자가 그 주소로 "직접" 접속하거나 새로고침하면 서버에는 해당 경로의 파일이 없어 404가 난다.
# 모든 경로 요청을 index.html로 되돌려(rewrite, 상태코드 200) 라우팅을 React가 처리하게 한다.
# (프록시 제거 후에도 이 rewrite는 반드시 파일 맨 뒤쪽 redirect로 유지한다.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 기본 보안 헤더(정적 사이트에 적용). 앱 동작에는 영향이 없으며 기본적인 방어층을 더한다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # [SEC-007] CSP: XSS가 성공해도 외부로 스크립트 로드·데이터 유출을 어렵게 만드는 방어층.
    # 허용 목록: 자기 자신 + Supabase(API·스토리지) + 폰트 CDN(Pretendard, Google Fonts).
    # 새 외부 리소스를 추가할 때는 이 목록에도 추가해야 한다(안 하면 콘솔에 CSP 오류가 뜬다).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://vflyqnbdquaanpkvuinz.supabase.co; connect-src 'self' https://vflyqnbdquaanpkvuinz.supabase.co wss://vflyqnbdquaanpkvuinz.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

# 해시가 붙은 정적 자산(빌드 산출물)은 내용이 바뀌면 파일명도 바뀌므로 장기 캐시해도 안전하다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
