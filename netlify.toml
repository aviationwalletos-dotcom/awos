# Netlify 배포 설정 (Aviation Wallet OS)
# 이 파일은 Netlify가 저장소를 어떻게 빌드하고 서빙할지 정의한다.

[build]
  # Vite 프로덕션 빌드 명령. 결과물은 dist/ 폴더에 생성된다.
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 빌드에 사용할 Node 버전을 고정한다(로컬/CI 동작 일치).
  NODE_VERSION = "20"

# ⚠️ 임시 백엔드 프록시 (1단계 전용 — 2단계에서 Supabase로 이전하면 이 블록을 통째로 삭제한다)
# 이 앱은 백엔드 API를 상대경로 `/aiapp-baas/...`로 호출한다(로그인·비행기록 저장 등).
# aiapp 호스팅에서는 같은 도메인에 그 API가 있었지만, Netlify에 올리면 우리 사이트에는 그 경로가
# 없어 로그인·데이터가 모두 실패한다. 그래서 `/aiapp-baas/*` 요청을 기존 aiapp 서버로 전달(프록시)해
# 기존 데이터(회원/비행기록)를 그대로 쓰며 배포를 검증한다. 완전 독립(2단계) 시 제거한다.
[[redirects]]
  from = "/aiapp-baas/*"
  to = "https://awos.aiapp.help/aiapp-baas/:splat"
  status = 200
  force = true

# SPA(단일 페이지 앱) 라우팅 처리:
# 이 앱은 react-router로 /login, /logbook, /dashboard 등 클라이언트 경로를 쓴다.
# 사용자가 그 주소로 "직접" 접속하거나 새로고침하면 서버에는 해당 경로의 파일이 없어 404가 난다.
# 모든 경로 요청을 index.html로 되돌려(rewrite, 상태코드 200) 라우팅을 React가 처리하게 한다.
# 주의: 위 API 프록시(/aiapp-baas/*)보다 뒤에 와야 한다(먼저 매칭되면 API가 index.html로 새어버림).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 기본 보안 헤더(정적 사이트에 적용). 앱 동작에는 영향이 없으며 기본적인 방어층을 더한다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 해시가 붙은 정적 자산(빌드 산출물)은 내용이 바뀌면 파일명도 바뀌므로 장기 캐시해도 안전하다.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
